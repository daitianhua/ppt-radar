<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT 每日雷达 · 每日 PPT 资讯精选</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1f2530; --sub:#5c6675; --line:#e6e9ef;
    --accent:#2f6df6; --soft:#eef3ff; --hot:#e8470b; --mid:#e8930b; --low:#2f6df6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;line-height:1.65;}
  .wrap{max-width:960px;margin:0 auto;padding:0 18px 64px;}

  /* Header */
  header{background:linear-gradient(135deg,#1f3a8a,#2f6df6);color:#fff;
    padding:30px 22px 26px;border-radius:0 0 18px 18px;margin-bottom:22px;}
  header .name{font-size:25px;font-weight:700;letter-spacing:.5px;}
  header .slogan{font-size:13.5px;opacity:.9;margin-top:6px;max-width:640px;}
  header .upd{font-size:12px;opacity:.78;margin-top:12px;}

  /* 今日精选 */
  .feature{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(20,30,50,.04);}
  .feature h2{font-size:15px;margin:0 0 12px;color:var(--accent);}
  .flist{display:grid;gap:10px;}
  .fitem{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fafbfe;}
  .fnum{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .fbody{flex:1;font-size:13.5px;}
  .fbody a{color:var(--ink);text-decoration:none;font-weight:600;}
  .fbody a:hover{color:var(--accent);}
  .fbody .fa{color:var(--sub);font-size:12.5px;margin-top:3px;}

  /* 导航 */
  nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip{padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:20px;
    font-size:13px;color:var(--sub);cursor:pointer;user-select:none;transition:.15s;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* 日期分组 */
  .dayhead{display:flex;align-items:center;gap:10px;margin:22px 0 12px;}
  .dayhead .d{font-size:16px;font-weight:700;}
  .dayhead .c{font-size:12px;color:var(--sub);}
  .dayhead .line{flex:1;height:1px;background:var(--line);}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:16px 18px;margin-bottom:13px;box-shadow:0 1px 3px rgba(20,30,50,.04);}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);}
  .heat{padding:1px 9px;border-radius:11px;font-weight:700;color:#fff;font-size:11.5px;}
  .heat.h90{background:var(--hot)} .heat.h80{background:var(--mid)} .heat.h70{background:var(--low)}
  .cat{background:var(--soft);color:var(--accent);padding:1px 9px;border-radius:11px;}
  .card h3{font-size:15.5px;margin:9px 0 7px;line-height:1.45;}
  .card h3 a{color:var(--ink);text-decoration:none;}
  .card h3 a:hover{color:var(--accent);}
  .summary{font-size:13.5px;color:#39414f;margin:0 0 9px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;}
  .tag{font-size:11.5px;color:var(--sub);background:#f1f3f7;padding:2px 8px;border-radius:8px;}
  .block{font-size:13px;padding:9px 12px;border-radius:9px;margin-top:8px;}
  .block.r{background:#f4f8ff;border-left:3px solid var(--accent);}
  .block.a{background:#fff6ef;border-left:3px solid var(--mid);}
  .block b{display:block;font-size:12px;margin-bottom:2px;color:#2a3650;}
  .block.a b{color:#9a5a12;}
  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:34px;line-height:1.8;}
  @media(max-width:600px){header .name{font-size:21px}.wrap{padding:0 12px 48px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="name" id="siteName">PPT 每日雷达</div>
    <div class="slogan" id="siteSlogan"></div>
    <div class="upd" id="siteUpd"></div>
  </header>

  <section class="feature">
    <h2>今日最值得花 2 分钟的 3 条</h2>
    <div class="flist" id="featureList"></div>
  </section>

  <nav id="nav"></nav>

  <div id="stream"></div>

  <footer>
    本站为每日 PPT 资讯精选，内容来自公开网络并标注来源，仅供内部参考。<br>
    资讯每日自动更新 · 具体功能以各厂商官网为准
  </footer>
</div>

<script src="news.js"></script>
<script>
  const DATA = window.PPT_RADAR;
  const CATS = ["全部","工具动态","软件更新","行业新闻","设计趋势","教程观点"];
  let curCat = "全部";

  // header
  document.getElementById("siteName").textContent = DATA.site.name;
  document.getElementById("siteSlogan").textContent = DATA.site.slogan;
  document.getElementById("siteUpd").textContent = "最后更新：" + DATA.site.updated;

  function heatClass(h){ return h>=90?"h90":h>=80?"h80":"h70"; }
  function heatColor(h){ return h>=90?"var(--hot)":h>=80?"var(--mid)":"var(--low)"; }

  // 今日精选：取最新一天 heat 前 3
  function renderFeature(){
    const items = (DATA.days[0]?.items || []).slice().sort((a,b)=>b.heat-a.heat).slice(0,3);
    const el = document.getElementById("featureList");
    el.innerHTML = items.map((it,i)=>`
      <div class="fitem">
        <div class="fnum">${i+1}</div>
        <div class="fbody">
          <a href="${it.url}" target="_blank" rel="noopener">${it.title}</a>
          <div class="fa">${it.source} · 热度 ${it.heat} ｜ ${it.action}</div>
        </div>
      </div>`).join("");
  }

  // 导航
  function renderNav(){
    const el = document.getElementById("nav");
    el.innerHTML = CATS.map(c=>{
      const n = c==="全部" ? totalItems() : countCat(c);
      return `<div class="chip ${c===curCat?'active':''}" data-c="${c}">${c} <span style="opacity:.6">${n}</span></div>`;
    }).join("");
    el.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{curCat=ch.dataset.c;renderNav();renderStream();});
  }
  function totalItems(){ return DATA.days.reduce((s,d)=>s+d.items.length,0); }
  function countCat(c){ return DATA.days.reduce((s,d)=>s+d.items.filter(i=>i.category===c).length,0); }

  // 信息流
  function renderStream(){
    const el = document.getElementById("stream");
    let html = "";
    DATA.days.forEach(day=>{
      let items = day.items.slice().sort((a,b)=>b.heat-a.heat);
      if(curCat!=="全部") items = items.filter(i=>i.category===curCat);
      if(!items.length) return;
      html += `<div class="dayhead"><div class="d">${day.date}</div><div class="c">${items.length} 条</div><div class="line"></div></div>`;
      items.forEach(it=>{
        html += `<div class="card">
          <div class="top">
            <span>${it.time}</span><span>·</span><span>${it.source}</span>
            <span class="heat ${heatClass(it.heat)}">热度 ${it.heat}</span>
            <span class="cat">${it.category}</span>
          </div>
          <h3><a href="${it.url}" target="_blank" rel="noopener">${it.title}</a></h3>
          <p class="summary">${it.summary}</p>
          <div class="tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
          <div class="block r"><b>为什么值得关注</b>${it.reason}</div>
          <div class="block a"><b>给你的行动建议</b>${it.action}</div>
        </div>`;
      });
    });
    el.innerHTML = html || `<p style="color:var(--sub);text-align:center;margin-top:30px">该分类暂无内容</p>`;
  }

  renderFeature();
  renderNav();
  renderStream();
</script>
</body>
</html>
